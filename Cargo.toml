[package]
name = "ayeyaiyai"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
num-bigint = "0.4.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
swc_common = "19.0.0"
swc_ecma_ast = "21.0.0"
swc_ecma_parser = "35.0.0"
tempfile = "3.23.0"
walkdir = "2.5.0"

[profile.dev]
opt-level = 1

[patch.crates-io]
swc_ecma_parser = { path = "vendor/swc_ecma_parser" }
